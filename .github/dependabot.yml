version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs-framework:
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-*"
          - "@nestjs/testing"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
