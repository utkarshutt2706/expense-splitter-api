name: Dependabot Sonar notice

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  notice:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const marker = '<!-- dependabot-sonar-notice -->';
            const command = [
              `git fetch origin ${branch}`,
              `git checkout ${branch}`,
              'git commit --allow-empty -m "Trigger CI as repo owner to get secrets access"',
              `git push origin ${branch}`,
            ].join('\n');

            const body = [
              marker,
              '**Heads up:** the `Sonar` required check will fail on this PR.',
              '',
              'GitHub withholds repository secrets (including `SONAR_TOKEN`) from ' +
                'workflow runs it attributes to Dependabot.',
              '',
              'Push a commit to this PR branch yourself to rerun checks with secrets. ' +
                'An empty commit works:',
              '',
              '```bash',
              command,
              '```',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
