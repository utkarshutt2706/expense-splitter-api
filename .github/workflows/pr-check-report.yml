name: Report PR check results

on:
  workflow_run:
    workflows: [CI, Sonar, CodeQL]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests[0];

            if (!pullRequest) {
              core.warning(`No pull request is associated with workflow run ${run.id}.`);
              return;
            }

            const marker = `<!-- pr-check-result:${run.name} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (run.conclusion === 'success') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            if (run.conclusion === 'cancelled') return;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedConclusions = new Set([
              'failure',
              'timed_out',
              'action_required',
              'startup_failure',
            ]);
            const failedJobs = jobs.filter((job) => failedConclusions.has(job.conclusion));

            const details = failedJobs.length
              ? failedJobs.flatMap((job) => {
                  const failedSteps = (job.steps ?? [])
                    .filter((step) => failedConclusions.has(step.conclusion))
                    .map((step) => `  - ${step.name}: ${step.conclusion}`);
                  return [
                    `- [${job.name}](${job.html_url}): ${job.conclusion}`,
                    ...failedSteps,
                  ];
                })
              : ['- GitHub did not expose a failed job. Open the workflow run for details.'];

            const body = [
              marker,
              `### ❌ ${run.name} check failed`,
              '',
              `Commit: \`${run.head_sha.slice(0, 7)}\``,
              `Conclusion: **${run.conclusion}**`,
              '',
              ...details,
              '',
              `[Open the complete workflow run](${run.html_url}) for logs and error output.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });
            }
