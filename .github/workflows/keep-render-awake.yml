name: Keep Render awake

on:
  schedule:
    # GitHub cron uses UTC. These windows probe every 10 minutes from
    # 06:52 through 03:42 IST, allowing Render to sleep from about 04:00
    # until the wake-up request shortly before 07:00 IST.
    - cron: '22,32,42,52 1 * * *'
    - cron: '2,12,22,32,42,52 2-21 * * *'
    - cron: '2,12 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify service URL is configured
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::error::Set the RENDER_SERVICE_URL repository variable to the public Render service URL."
            exit 1
          fi

      - name: Probe health endpoint
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 90 \
            "${RENDER_SERVICE_URL%/}/health"
