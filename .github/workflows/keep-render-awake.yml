name: Keep Render awake

on:
  schedule:
    # GitHub cron uses UTC. These windows probe every 5 minutes from
    # 06:52 through 03:42 IST, allowing Render to sleep from about 04:00
    # until the wake-up request shortly before 07:00 IST.
    - cron: '22,27,32,37,42,47,52,57 1 * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 2-21 * * *'
    - cron: '2,7,12 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify probe and email configuration
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          HEALTH_ALERT_EMAIL: ${{ vars.HEALTH_ALERT_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::error::Set the RENDER_SERVICE_URL repository variable to the public Render service URL."
            exit 1
          fi
          if [ -z "$HEALTH_ALERT_EMAIL" ]; then
            echo "::error::Set the HEALTH_ALERT_EMAIL repository variable."
            exit 1
          fi
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Set the GMAIL_USER and GMAIL_APP_PASSWORD repository secrets."
            exit 1
          fi

      - name: Probe health endpoint
        id: health
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          response_file="$(mktemp)"
          curl_exit=0
          http_status="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --retry-max-time 150 \
            --connect-timeout 10 \
            --max-time 75 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${RENDER_SERVICE_URL%/}/health")" || curl_exit=$?

          response_body="$(head -c 4000 "$response_file" | tr '\n' ' ')"
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "response=$response_body" >> "$GITHUB_OUTPUT"

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Health probe failed with curl exit code $curl_exit and HTTP status $http_status: $response_body"
            exit "$curl_exit"
          fi

      - name: Email health-check failure
        if: failure() && steps.health.outcome == 'failure'
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: 'Expense Splitter Health Monitor <${{ secrets.GMAIL_USER }}>'
          to: ${{ vars.HEALTH_ALERT_EMAIL }}
          subject: Expense Splitter backend health check failed
          body: |
            The scheduled Expense Splitter backend health check failed.

            HTTP status: ${{ steps.health.outputs.http_status }}
            Response: ${{ steps.health.outputs.response }}
            Service: ${{ vars.RENDER_SERVICE_URL }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
