name: Sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: >-
          pnpm test --runInBand --coverage
          --coverageReporters=lcov
          --coverageReporters=json-summary
          --coverageReporters=text
      - name: Comment coverage summary
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const coverageReport = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8'),
            );
            const summary = coverageReport.total;
            const marker = '<!-- backend-coverage-report -->';
            const labels = {
              lines: 'Lines',
              statements: 'Statements',
              functions: 'Functions',
              branches: 'Branches',
            };
            const thresholds = {
              lines: 80,
              statements: 80,
              functions: 80,
              branches: 70,
            };
            const rows = Object.entries(labels).map(([key, label]) => {
              const coverage = summary[key];
              const status = coverage.pct >= thresholds[key] ? '🟢' : '🔴';
              return `<tr> <td align="center">${status}</td> <td align="left">${label}</td> <td align="right">${coverage.pct}% (🎯 ${thresholds[key]}%)</td> <td align="right">${coverage.covered} / ${coverage.total}</td> </tr>`;
            });
            const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const commitSha = context.payload.pull_request.head.sha;
            const pullRequestFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changedSourceFiles = pullRequestFiles
              .filter(({ filename, status }) =>
                status !== 'removed' && filename.startsWith('src/') && filename.endsWith('.ts'),
              )
              .map(({ filename }) => filename)
              .sort();
            const coverageByFile = new Map(
              Object.entries(coverageReport)
                .filter(([filename]) => filename !== 'total')
                .map(([filename, coverage]) => [
                  path.relative(process.cwd(), filename).split(path.sep).join('/'),
                  coverage,
                ]),
            );
            const escapeHtml = (value) => value
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#39;');
            const fileCoverageRows = changedSourceFiles.map((filename) => {
              const coverage = coverageByFile.get(filename);
              const cell = (key) => {
                if (!coverage) return '<td align="center">🔴 Not covered</td>';
                const status = coverage[key].pct >= thresholds[key] ? '🟢' : '🔴';
                return `<td align="right">${status} ${coverage[key].pct}%</td>`;
              };
              return `<tr> <td align="left"><code>${escapeHtml(filename)}</code></td> ${cell('lines')} ${cell('statements')} ${cell('functions')} ${cell('branches')} </tr>`;
            });
            const fileCoverage = changedSourceFiles.length === 0
              ? '<details><summary>File Coverage</summary>No changed source files found.</details>'
              : [
                  '<details><summary>File Coverage</summary>',
                  '<table> <thead> <tr> <th align="left">File</th> <th align="right">Lines</th> <th align="right">Statements</th> <th align="right">Functions</th> <th align="right">Branches</th> </tr> </thead> <tbody>',
                  ...fileCoverageRows,
                  '</tbody> </table></details>',
                ].join('\n');
            const body = [
              '<h2>Coverage Report</h2>',
              '<table> <thead> <tr> <th align="center">Status</th> <th align="left">Category</th> <th align="right">Percentage</th> <th align="right">Covered / Total</th> </tr> </thead> <tbody>',
              ...rows,
              `</tbody> </table>${fileCoverage}`,
              `<em>Generated in workflow <a href="${repositoryUrl}/actions/runs/${context.runId}">#${context.runNumber}</a> for commit <a href="${repositoryUrl}/commit/${commitSha}">${commitSha.slice(0, 7)}</a> by the <a href="https://jestjs.io/docs/configuration#coveragereporters-arraystring--string-options">Jest Coverage Reporter</a></em>`,
              '',
              marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        # Fork PRs do not receive SONAR_TOKEN. Tests still run above; only the scan is skipped.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
