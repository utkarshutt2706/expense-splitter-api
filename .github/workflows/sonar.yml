name: Sonar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: >-
          pnpm test --runInBand --coverage
          --coverageReporters=lcov
          --coverageReporters=json
          --coverageReporters=json-summary
          --coverageReporters=text
      - name: Comment coverage summary
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const coverageReport = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8'),
            );
            const finalCoverageReport = JSON.parse(
              fs.readFileSync('coverage/coverage-final.json', 'utf8'),
            );
            const summary = coverageReport.total;
            const marker = '<!-- backend-coverage-report -->';
            const labels = {
              lines: 'Lines',
              statements: 'Statements',
              functions: 'Functions',
              branches: 'Branches',
            };
            const thresholds = {
              lines: 80,
              statements: 80,
              functions: 80,
              branches: 70,
            };
            const rows = Object.entries(labels).map(([key, label]) => {
              const coverage = summary[key];
              const status = coverage.pct >= thresholds[key] ? '🟢' : '🔴';
              return `<tr> <td align="center">${status}</td> <td align="left">${label}</td> <td align="right">${coverage.pct}% (🎯 ${thresholds[key]}%)</td> <td align="right">${coverage.covered} / ${coverage.total}</td> </tr>`;
            });
            const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`;
            const commitSha = context.payload.pull_request.head.sha;
            const pullRequestFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const coverageByFile = new Map(
              Object.entries(coverageReport)
                .filter(([filename]) => filename !== 'total')
                .map(([filename, coverage]) => [
                  path.relative(process.cwd(), filename).split(path.sep).join('/'),
                  coverage,
                ]),
            );
            const finalCoverageByFile = new Map(
              Object.entries(finalCoverageReport).map(([filename, coverage]) => [
                path.relative(process.cwd(), filename).split(path.sep).join('/'),
                coverage,
              ]),
            );
            // Only report production files measured by Jest. This intentionally
            // excludes changed specs and files excluded by the coverage config.
            const changedCoveredFiles = pullRequestFiles
              .filter(({ filename, status }) =>
                status !== 'removed' && coverageByFile.has(filename),
              )
              .map(({ filename }) => filename)
              .sort();
            const escapeHtml = (value) => value
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#39;');
            const compactLineRanges = (lines) => {
              const ranges = [];
              for (const line of lines) {
                const previous = ranges.at(-1);
                if (previous && line === previous.end + 1) previous.end = line;
                else ranges.push({ start: line, end: line });
              }
              return ranges;
            };
            const uncoveredLineLinks = (filename) => {
              const details = finalCoverageByFile.get(filename);
              if (!details) return '—';
              const lines = [...new Set(
                Object.entries(details.s)
                  .filter(([, count]) => count === 0)
                  .map(([id]) => details.statementMap[id].start.line),
              )].sort((left, right) => left - right);
              if (lines.length === 0) return '—';
              const encodedFilename = filename.split('/').map(encodeURIComponent).join('/');
              return compactLineRanges(lines).map(({ start, end }) => {
                const label = start === end ? `${start}` : `${start}-${end}`;
                const anchor = start === end ? `#L${start}` : `#L${start}-L${end}`;
                return `<a href="${repositoryUrl}/blob/${commitSha}/${encodedFilename}${anchor}">${label}</a>`;
              }).join(', ');
            };
            const fileCoverageRows = changedCoveredFiles.map((filename) => {
              const coverage = coverageByFile.get(filename);
              const encodedFilename = filename.split('/').map(encodeURIComponent).join('/');
              const fileLink = `<a href="${repositoryUrl}/blob/${commitSha}/${encodedFilename}"><code>${escapeHtml(filename)}</code></a>`;
              return `<tr> <td align="left">${fileLink}</td> <td align="right">${coverage.statements.pct}%</td> <td align="right">${coverage.branches.pct}%</td> <td align="right">${coverage.functions.pct}%</td> <td align="right">${coverage.lines.pct}%</td> <td align="left">${uncoveredLineLinks(filename)}</td> </tr>`;
            });
            const fileCoverage = changedCoveredFiles.length === 0
              ? '<details><summary>File Coverage</summary>No changed coverable source files found.</details>'
              : [
                  '<details><summary>File Coverage</summary>',
                  '<table> <thead> <tr> <th align="left">File</th> <th align="right">Statements</th> <th align="right">Branches</th> <th align="right">Functions</th> <th align="right">Lines</th> <th align="left">Uncovered Lines</th> </tr> </thead> <tbody>',
                  ...fileCoverageRows,
                  '</tbody> </table></details>',
                ].join('\n');
            const body = [
              '<h2>Coverage Report</h2>',
              '<table> <thead> <tr> <th align="center">Status</th> <th align="left">Category</th> <th align="right">Percentage</th> <th align="right">Covered / Total</th> </tr> </thead> <tbody>',
              ...rows,
              `</tbody> </table>${fileCoverage}`,
              `<em>Generated in workflow <a href="${repositoryUrl}/actions/runs/${context.runId}">#${context.runNumber}</a> for commit <a href="${repositoryUrl}/commit/${commitSha}">${commitSha.slice(0, 7)}</a> by the <a href="https://jestjs.io/docs/configuration#coveragereporters-arraystring--string-options">Jest Coverage Reporter</a></em>`,
              '',
              marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        # Fork PRs do not receive SONAR_TOKEN. Tests still run above; only the scan is skipped.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -Dsonar.qualitygate.wait=true
