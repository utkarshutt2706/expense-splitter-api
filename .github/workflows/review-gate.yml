name: Review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  checks: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_REVIEWER: ${{ vars.REQUIRED_REVIEWER || github.repository_owner }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = process.env.REQUIRED_REVIEWER;
            const checkName = 'review-required';
            const pr = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              per_page: 100,
            });
            const allMine = commits.every((c) => c.author && c.author.login === owner);

            let conclusion = 'failure';
            let summary = `This PR has commits not authored by ${owner} and has not been approved by ${owner} yet.`;

            if (allMine) {
              conclusion = 'success';
              summary = `All commits authored by ${owner}, no review required.`;
            } else {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr,
                per_page: 100,
              });
              const latestOwnerReview = reviews
                .filter(
                  (r) =>
                    r.user.login === owner &&
                    r.commit_id === headSha &&
                    ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state),
                )
                .pop();
              if (latestOwnerReview?.state === 'APPROVED') {
                conclusion = 'success';
                summary = `Approved by ${owner}.`;
              }
            }

            const existing = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: checkName,
              per_page: 100,
            });

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: { title: checkName, summary },
            };

            if (existing.length > 0) {
              await github.rest.checks.update({ check_run_id: existing[0].id, ...payload });
            } else {
              await github.rest.checks.create(payload);
            }

            core.info(summary);
