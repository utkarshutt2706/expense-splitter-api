name: Review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  checks: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = 'utkarshutt2706';
            const checkName = 'review-required';
            const pr = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            const allMine = commits.every((c) => c.author && c.author.login === owner);

            let conclusion = 'failure';
            let summary = `This PR has commits not authored by ${owner} and has not been approved by ${owner} yet.`;

            if (allMine) {
              conclusion = 'success';
              summary = `All commits authored by ${owner}, no review required.`;
            } else {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr,
              });
              const latestOwnerReview = reviews.filter((r) => r.user.login === owner).pop();
              if (latestOwnerReview && latestOwnerReview.state === 'APPROVED') {
                conclusion = 'success';
                summary = `Approved by ${owner}.`;
              }
            }

            const { data: existing } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: checkName,
            });

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: headSha,
              status: 'completed',
              conclusion,
              output: { title: checkName, summary },
            };

            if (existing.check_runs.length > 0) {
              await github.rest.checks.update({ check_run_id: existing.check_runs[0].id, ...payload });
            } else {
              await github.rest.checks.create(payload);
            }

            core.info(summary);
