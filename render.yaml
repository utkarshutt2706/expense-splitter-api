services:
  - type: web
    name: expense-splitter-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm prisma:migrate:deploy && node dist/main.js
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://utkarshutt2706.github.io
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
