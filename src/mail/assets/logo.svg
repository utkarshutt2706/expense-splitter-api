<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g transform="translate(250, 277)">

    <!-- Outer Connecting Circular Arc Segments -->
    <!-- Top Arc -->
    <path d="M -115 -105 A 155 155 0 0 1 115 -105"
          fill="none" stroke="#F27318" stroke-width="24" stroke-linecap="round" />

    <!-- Bottom-Right Arc -->
    <path d="M 148 -47 A 155 155 0 0 1 33 151"
          fill="none" stroke="#F27318" stroke-width="24" stroke-linecap="round" />

    <!-- Bottom-Left Arc -->
    <path d="M -33 151 A 155 155 0 0 1 -148 -47"
          fill="none" stroke="#F27318" stroke-width="24" stroke-linecap="round" />

    <!-- Central Geometric Split Form (Cube / Pie Concept) -->
    <!-- Top Segment -->
    <path d="M 0 -10 L -120 -80 L 0 -150 L 120 -80 Z"
          fill="#F27318" />
    <!-- Top Segment Highlight Accent -->
    <path d="M 0 -10 L 0 -150 L 120 -80 Z"
          fill="#FF9433" />

    <!-- Bottom-Left Segment -->
    <path d="M -10 5 L -130 -65 L -130 85 L -10 155 Z"
          fill="#D45A0F" />
    <!-- Bottom-Left Internal Facet Accent -->
    <path d="M -10 5 L -130 -65 L -10 155 Z"
          fill="#F27318" />

    <!-- Bottom-Right Segment -->
    <path d="M 10 5 L 10 155 L 130 85 L 130 -65 Z"
          fill="#F27318" />
    <!-- Bottom-Right Internal Facet Accent -->
    <path d="M 10 5 L 130 85 L 130 -65 Z"
          fill="#FFB25C" />

    <!-- Outer Circular Nodes (People / Connections) -->
    <!-- Top Node -->
    <circle cx="0" cy="-175" r="42" fill="#F27318" />

    <!-- Bottom-Right Node -->
    <circle cx="152" cy="88" r="42" fill="#F27318" />

    <!-- Bottom-Left Node -->
    <circle cx="-152" cy="88" r="42" fill="#F27318" />

  </g>
</svg>
